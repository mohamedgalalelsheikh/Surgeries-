<style>
  :root{
    --ink:#16231F;
    --ink-2:#1F332D;
    --ink-3:#25392F;
    --paper:#F1EEE6;
    --paper-dim:#E4DFD2;
    --paper-line:#D8D1BF;
    --accent:#B8834A;
    --accent-soft:#D9B77E;
    --ivory:#EDE7DA;
    --ink-text:#20241F;
    --muted:#6E7C74;
    --complication:#A65C4A;
    --good:#7FA588;
    --border:rgba(237,231,218,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--ivory);
    font-family:-apple-system,'SF Pro Text',system-ui,'Segoe UI',Tahoma,sans-serif;
    min-height:100vh;
  }
  [dir="rtl"] body{font-family:-apple-system,'SF Arabic','Geeza Pro',system-ui,Tahoma,sans-serif;}
  h1,h2,h3{font-family:Georgia,'Iowan Old Style','Times New Roman',serif; font-weight:600; margin:0;}
  .app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--ink);display:flex;flex-direction:column;}

  /* header */
  header{padding:22px 18px 0;border-bottom:1px solid var(--border);}
  .titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .titlebar h1{font-size:19px;color:var(--ivory);letter-spacing:.2px;}
  .titlebar .sub{font-size:12px;color:var(--accent-soft);margin-top:2px;}
  .langbtn{
    border:1px solid var(--accent);color:var(--accent-soft);background:transparent;
    border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;
  }
  .langbtn:active{background:var(--ink-3);}
  nav{display:flex;margin-top:16px;}
  nav button{
    flex:1;background:transparent;border:none;color:var(--muted);
    font-size:13px;padding:10px 4px 12px;cursor:pointer;border-bottom:2px solid transparent;
    font-family:inherit;
  }
  nav button.active{color:var(--accent-soft);border-bottom:2px solid var(--accent);}

  main{flex:1;background:var(--paper);color:var(--ink-text);border-radius:18px 18px 0 0;margin-top:0;padding:20px 18px 60px;}

  .section{display:none;}
  .section.active{display:block;}

  label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px;}
  label.first{margin-top:0;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;padding:10px 11px;border:1px solid var(--paper-line);border-radius:8px;
    background:#fff;color:var(--ink-text);font-size:15px;font-family:inherit;
  }
  textarea{min-height:56px;resize:vertical;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);outline-offset:0;border-color:var(--accent);}

  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}

  .comp-toggle{display:flex;gap:8px;margin-top:6px;}
  .comp-toggle button{
    flex:1;padding:9px;border-radius:8px;border:1px solid var(--paper-line);background:#fff;
    font-size:13px;cursor:pointer;color:var(--ink-text);
  }
  .comp-toggle button.sel-none{background:var(--good);border-color:var(--good);color:#fff;}
  .comp-toggle button.sel-yes{background:var(--complication);border-color:var(--complication);color:#fff;}
  .comp-toggle button.sel-exact{background:var(--ink);border-color:var(--ink);color:#fff;}
  .comp-toggle button.sel-later{background:var(--accent);border-color:var(--accent);color:#fff;}
  .comp-toggle button.sel-free{background:var(--good);border-color:var(--good);color:#fff;}

  .save-btn{
    width:100%;margin-top:20px;padding:13px;border:none;border-radius:9px;
    background:var(--ink);color:var(--ivory);font-size:15px;cursor:pointer;font-family:inherit;
  }
  .save-btn:active{background:var(--ink-2);}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px;}

  /* records list */
  .toolbar{display:flex;gap:8px;margin-bottom:14px;}
  .toolbar input,.toolbar select{padding:8px 10px;font-size:13px;}
  .rec-count{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .rec{
    border-top:1px solid var(--paper-line);padding:12px 0;cursor:pointer;
  }
  .rec:last-child{border-bottom:1px solid var(--paper-line);}
  .rec-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .rec-name{font-size:15px;font-weight:600;}
  .rec-date{font-size:12px;color:var(--muted);white-space:nowrap;}
  .rec-mid{font-size:13px;color:#3d453f;margin-top:3px;}
  .rec-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--paper-dim);color:var(--muted);}
  .tag.comp{background:var(--complication);color:#fff;}
  .rec-detail{margin-top:10px;padding:12px;background:var(--paper-dim);border-radius:8px;font-size:13px;line-height:1.6;}
  .rec-actions{display:flex;gap:10px;margin-top:10px;}
  .rec-actions button{
    font-size:12.5px;padding:7px 12px;border-radius:7px;border:1px solid var(--paper-line);
    background:#fff;cursor:pointer;color:var(--ink-text);
  }
  .rec-actions button.del{color:var(--complication);border-color:var(--complication);}
  .empty{text-align:center;padding:40px 10px;color:var(--muted);font-size:14px;}

  /* analysis */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
  .stat{background:var(--ink);color:var(--ivory);border-radius:10px;padding:14px;}
  .stat .num{font-size:22px;font-family:Georgia,serif;color:var(--accent-soft);}
  .stat .lbl{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .analysis-block{margin-bottom:24px;}
  .analysis-block h3{font-size:14px;color:var(--ink-text);margin-bottom:10px;}
  .bar-row{margin-bottom:9px;}
  .bar-row .bl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;color:#3d453f;}
  .bar-track{background:var(--paper-dim);border-radius:5px;height:9px;overflow:hidden;}
  .bar-fill{background:var(--accent);height:100%;border-radius:5px;}
  select.analysis-select{width:auto;margin-bottom:14px;}

  /* settings */
  .settings-card{background:var(--ink);color:var(--ivory);border-radius:10px;padding:16px;margin-bottom:16px;}
  .settings-card label{color:var(--accent-soft);}
  .settings-card input{background:var(--ink-3);border:1px solid var(--border);color:var(--ivory);}
  .btnrow{display:flex;gap:8px;margin-top:12px;}
  .btnrow button{
    flex:1;padding:10px;border-radius:8px;border:1px solid var(--accent);background:transparent;
    color:var(--accent-soft);font-size:13px;cursor:pointer;font-family:inherit;
  }
  .status-line{font-size:11.5px;color:var(--muted);margin-top:10px;}
  .danger-btn{width:100%;padding:10px;border-radius:8px;border:1px solid var(--complication);background:transparent;color:var(--complication);font-size:13px;margin-top:6px;cursor:pointer;}

  ::placeholder{color:#a9a293;}
  [dir="rtl"] .row2, [dir="rtl"] .toolbar, [dir="rtl"] .rec-top, [dir="rtl"] .comp-toggle, [dir="rtl"] .btnrow, [dir="rtl"] .rec-actions{flex-direction:row-reverse;}
</style>
</head>
<body>
<div class="app" id="app" dir="ltr">

  <header>
    <div class="titlebar">
      <div>
        <h1 id="t-appTitle">Surgical Operations Log</h1>
        <div class="sub" id="t-appSub">Private clinical record</div>
      </div>
      <button class="langbtn" id="langBtn" onclick="toggleLang()">العربية</button>
    </div>
    <nav>
      <button class="tab-btn active" data-tab="new" id="t-tabNew">New Entry</button>
      <button class="tab-btn" data-tab="records" id="t-tabRecords">Records</button>
      <button class="tab-btn" data-tab="analysis" id="t-tabAnalysis">Analysis</button>
      <button class="tab-btn" data-tab="settings" id="t-tabSettings">Settings</button>
    </nav>
  </header>

  <main>

    <!-- NEW ENTRY -->
    <section class="section active" id="sec-new">
      <label class="first" id="l-patientName">Patient name</label>
      <input type="text" id="f-patientName" dir="auto" placeholder="">

      <div class="row2">
        <div>
          <label id="l-age">Age</label>
          <input type="number" id="f-age" min="0" max="120">
        </div>
        <div>
          <label id="l-date">Date</label>
          <input type="date" id="f-date">
        </div>
      </div>

      <label id="l-hospital">Hospital</label>
      <input type="text" id="f-hospital" list="hospitalList" dir="auto">
      <datalist id="hospitalList">
        <option value="Welcare Hospital">
        <option value="Al-Safa Hospital">
        <option value="Al-Faransawy Hospital">
        <option value="Al-Ofoq Hospital">
        <option value="Nasser Institute for Research and Treatment">
        <option value="Kasr Al-Ainy Hospital">
      </datalist>

      <label id="l-indication">Indication for surgery</label>
      <textarea id="f-indication" dir="auto" list="indicationList"></textarea>

      <label id="l-operationDone">Operation performed</label>
      <textarea id="f-operationDone" dir="auto" list="opList"></textarea>
      <datalist id="opList">
        <option value="HoLEP">
        <option value="ThuLEP">
        <option value="En-bloc enucleation">
        <option value="Laparoscopic radical prostatectomy">
        <option value="Laparoscopic radical nephrectomy">
        <option value="Laparoscopic partial nephrectomy">
        <option value="Laparoscopic pyeloplasty">
        <option value="Laparoscopic ureterolithotomy">
        <option value="Laparoscopic varicocelectomy">
        <option value="Laparoscopic nephroureterectomy">
        <option value="Robotic-assisted radical prostatectomy">
        <option value="Robotic partial nephrectomy">
        <option value="Robotic radical nephrectomy">
        <option value="Robotic pyeloplasty">
        <option value="Robotic radical cystectomy">
        <option value="Robotic ureteric reimplantation">
      </datalist>

      <label id="l-complications">Intraoperative complications</label>
      <div class="comp-toggle">
        <button type="button" id="compNoneBtn" onclick="setComp(false)" class="sel-none">—</button>
        <button type="button" id="compYesBtn" onclick="setComp(true)">—</button>
      </div>
      <textarea id="f-complications" dir="auto" style="margin-top:8px;display:none;"></textarea>

      <label id="l-cost">Cost (EGP)</label>
      <div class="comp-toggle" id="costToggle">
        <button type="button" id="costExactBtn" onclick="setCostType('exact')">—</button>
        <button type="button" id="costLaterBtn" onclick="setCostType('later')">—</button>
        <button type="button" id="costFreeBtn" onclick="setCostType('free')">—</button>
      </div>
      <input type="number" id="f-cost" min="0" step="1" style="margin-top:8px;">

      <button class="save-btn" id="saveBtn" onclick="saveRecord()">Save record</button>
      <div class="hint" id="editHint" style="display:none;"></div>
    </section>

    <!-- RECORDS -->
    <section class="section" id="sec-records">
      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search" oninput="renderRecords()" style="flex:2;" dir="auto">
        <select id="hospFilter" onchange="renderRecords()" style="flex:1;">
          <option value="" id="o-allHospitals">All hospitals</option>
        </select>
      </div>
      <div class="rec-count" id="recCount"></div>
      <div id="recList"></div>
    </section>

    <!-- ANALYSIS -->
    <section class="section" id="sec-analysis">
      <div class="stat-grid">
        <div class="stat"><div class="num" id="s-total">0</div><div class="lbl" id="s-totalLbl">Total operations</div></div>
        <div class="stat"><div class="num" id="s-comprate">0%</div><div class="lbl" id="s-comprateLbl">Complication rate</div></div>
        <div class="stat"><div class="num" id="s-avgcost">0</div><div class="lbl" id="s-avgcostLbl">Average cost</div></div>
        <div class="stat"><div class="num" id="s-totalcost">0</div><div class="lbl" id="s-totalcostLbl">Total revenue</div></div>
      </div>

      <div class="analysis-block">
        <h3 id="a-byHospital">By hospital</h3>
        <div id="chart-hospital"></div>
      </div>
      <div class="analysis-block">
        <h3 id="a-byOperation">By operation type</h3>
        <div id="chart-operation"></div>
      </div>
      <div class="analysis-block">
        <h3 id="a-byIndication">By indication</h3>
        <div id="chart-indication"></div>
      </div>
      <div class="analysis-block">
        <h3 id="a-byMonth">By month</h3>
        <div id="chart-month"></div>
      </div>

      <div class="analysis-block">
        <h3 id="a-breakdownTitle">Hospital &amp; operation breakdown</h3>
        <div class="toolbar" style="margin-bottom:10px;">
          <select id="bd-hospital" onchange="renderBreakdown()" style="flex:1;"></select>
          <select id="bd-gran" onchange="renderBreakdown()" style="flex:1;">
            <option value="month" id="o-granMonth">Month</option>
            <option value="week" id="o-granWeek">Week</option>
            <option value="year" id="o-granYear">Year</option>
          </select>
        </div>
        <div id="breakdownList"></div>
      </div>

      <h2 id="a-financialTitle" style="font-size:16px;margin:26px 0 14px;padding-top:16px;border-top:1px solid var(--paper-line);">Financial analysis</h2>
      <div class="analysis-block">
        <h3 id="a-revWeek">Revenue by week</h3>
        <div id="chart-fin-week"></div>
      </div>
      <div class="analysis-block">
        <h3 id="a-revMonth">Revenue by month</h3>
        <div id="chart-fin-month"></div>
      </div>
      <div class="analysis-block">
        <h3 id="a-revYear">Revenue by year</h3>
        <div id="chart-fin-year"></div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="section" id="sec-settings">
      <div class="settings-card">
        <label id="l-sheetUrl">Google Sheet web app URL</label>
        <input type="text" id="f-sheetUrl" placeholder="https://script.google.com/macros/s/.../exec">
        <div class="btnrow">
          <button onclick="saveSheetUrl()" id="b-saveUrl">Save</button>
          <button onclick="syncToSheets()" id="b-syncNow">Sync now</button>
        </div>
        <button onclick="forceResync()" id="b-forceResync" style="width:100%;margin-top:8px;padding:9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12.5px;">Resend all records</button>
        <div class="status-line" id="syncStatus"></div>
      </div>
      <div class="btnrow">
        <button onclick="exportCSV()" id="b-exportCsv" style="flex:1;">Export CSV</button>
      </div>
      <button class="danger-btn" id="b-clearAll" onclick="clearAll()">Erase all records on this device</button>
    </section>

  </main>
</div>

<script>
/* ---------- translations ---------- */
const T = {
  en:{
    appTitle:"Surgical Operations Log", appSub:"Private clinical record",
    tabNew:"New Entry", tabRecords:"Records", tabAnalysis:"Analysis", tabSettings:"Settings",
    patientName:"Patient name", age:"Age", date:"Date", hospital:"Hospital",
    indication:"Indication for surgery", operationDone:"Operation performed",
    complications:"Intraoperative complications", cost:"Cost (EGP)",
    costExact:"Exact amount", costLater:"Pay later", costFree:"Free",
    compNone:"None", compYes:"Complication occurred",
    save:"Save record", saved:"Record saved", update:"Update record", editing:"Editing an existing record",
    searchPh:"Search patient, operation, indication…", allHospitals:"All hospitals",
    recCount1:"record", recCountN:"records", empty:"No records yet — add your first operation above.",
    view:"View", edit:"Edit", del:"Delete", confirmDel:"Delete this record?",
    totalOps:"Total operations", compRate:"Complication rate", avgCost:"Average cost", totalCost:"Total revenue",
    byHospital:"By hospital", byOperation:"By operation type", byIndication:"By indication", byMonth:"By month",
    financialTitle:"Financial analysis", revWeek:"Revenue by week", revMonth:"Revenue by month", revYear:"Revenue by year",
    breakdownTitle:"Hospital & operation breakdown", granWeek:"Week", granMonth:"Month", granYear:"Year",
    breakdownEmpty:"No matching records for this selection.", opsCount:"operations",
    sheetUrl:"Google Sheet web app URL", saveUrl:"Save", syncNow:"Sync now",
    exportCsv:"Export CSV", clearAll:"Erase all records on this device",
    noUrl:"Add a Google Sheet web app URL first.", syncing:"Syncing…",
    synced:(n)=>`Synced ${n} record(s) — check your sheet to confirm.`,
    savedUrl:"URL saved.", nothingToSync:"Everything is already synced.",
    forceResync:"Resend all records", forceResyncConfirm:"Resend every record to the sheet, even ones already marked as synced? Use this if records aren't showing up after a normal sync.",
    confirmClear:"This deletes every record stored on this device. This cannot be undone. Continue?",
    reqName:"Enter a patient name before saving."
  },
  ar:{
    appTitle:"سجل العمليات الجراحية", appSub:"سجل طبي خاص",
    tabNew:"عملية جديدة", tabRecords:"السجلات", tabAnalysis:"التحليل", tabSettings:"الإعدادات",
    patientName:"اسم المريض", age:"العمر", date:"التاريخ", hospital:"المستشفى",
    indication:"دواعي الجراحة", operationDone:"العملية التي أُجريت",
    complications:"مضاعفات أثناء العملية", cost:"التكلفة (جنيه)",
    costExact:"مبلغ محدد", costLater:"يُدفع لاحقاً", costFree:"مجاني",
    compNone:"لا يوجد", compYes:"حدثت مضاعفات",
    save:"حفظ السجل", saved:"تم حفظ السجل", update:"تحديث السجل", editing:"جارٍ تعديل سجل موجود",
    searchPh:"بحث بالاسم أو العملية أو الدواعي…", allHospitals:"كل المستشفيات",
    recCount1:"سجل", recCountN:"سجلات", empty:"لا توجد سجلات بعد — أضف أول عملية أعلاه.",
    view:"عرض", edit:"تعديل", del:"حذف", confirmDel:"حذف هذا السجل؟",
    totalOps:"إجمالي العمليات", compRate:"نسبة المضاعفات", avgCost:"متوسط التكلفة", totalCost:"إجمالي الإيرادات",
    byHospital:"حسب المستشفى", byOperation:"حسب نوع العملية", byIndication:"حسب الدواعي", byMonth:"حسب الشهر",
    financialTitle:"التحليل المالي", revWeek:"الإيرادات أسبوعياً", revMonth:"الإيرادات شهرياً", revYear:"الإيرادات سنوياً",
    breakdownTitle:"تحليل حسب المستشفى والعملية", granWeek:"أسبوعي", granMonth:"شهري", granYear:"سنوي",
    breakdownEmpty:"لا توجد سجلات مطابقة لهذا الاختيار.", opsCount:"عملية",
    sheetUrl:"رابط تطبيق جوجل شيتس", saveUrl:"حفظ", syncNow:"مزامنة الآن",
    exportCsv:"تصدير CSV", clearAll:"حذف كل السجلات من هذا الجهاز",
    noUrl:"أضف رابط تطبيق جوجل شيتس أولاً.", syncing:"جارٍ المزامنة…",
    synced:(n)=>`تمت مزامنة ${n} سجل — راجع الشيت للتأكيد.`,
    savedUrl:"تم حفظ الرابط.", nothingToSync:"كل شيء متزامن بالفعل.",
    forceResync:"إعادة إرسال كل السجلات", forceResyncConfirm:"إعادة إرسال كل سجل إلى الشيت، حتى المسجل بالفعل كمتزامن؟ استخدم هذا إذا لم تظهر السجلات بعد المزامنة العادية.",
    confirmClear:"سيتم حذف كل سجل مخزن على هذا الجهاز نهائياً. متابعة؟",
    reqName:"أدخل اسم المريض قبل الحفظ."
  }
};

let lang = 'en';
let records = [];
let settings = {sheetUrl:''};
let editingId = null;
let compHasIssue = false;

/* ---------- storage (localStorage: persists on real browsers/devices) ---------- */
async function loadData(){
  try{
    const r = localStorage.getItem('surglog_operations');
    records = r ? JSON.parse(r) : [];
  }catch(e){ records = []; }
  try{
    const s = localStorage.getItem('surglog_settings');
    if(s) settings = JSON.parse(s);
  }catch(e){ settings = {sheetUrl:''}; }
  try{
    const l = localStorage.getItem('surglog_lang');
    if(l) lang = l;
  }catch(e){}
}
async function persistRecords(){
  try{ localStorage.setItem('surglog_operations', JSON.stringify(records)); }
  catch(e){ console.error('save failed', e); alert('Could not save — your device storage may be full or restricted.'); }
}
async function persistSettings(){
  try{ localStorage.setItem('surglog_settings', JSON.stringify(settings)); }
  catch(e){ console.error('save failed', e); }
}
async function persistLang(){
  try{ localStorage.setItem('surglog_lang', lang); }catch(e){}
}

/* ---------- i18n render ---------- */
function applyLang(){
  const dict = T[lang];
  document.getElementById('app').setAttribute('dir', lang==='ar' ? 'rtl':'ltr');
  document.getElementById('app').setAttribute('lang', lang);
  document.getElementById('langBtn').textContent = lang==='ar' ? 'English' : 'العربية';
  const map = {
    't-appTitle':'appTitle','t-appSub':'appSub','t-tabNew':'tabNew','t-tabRecords':'tabRecords',
    't-tabAnalysis':'tabAnalysis','t-tabSettings':'tabSettings','l-patientName':'patientName',
    'l-age':'age','l-date':'date','l-hospital':'hospital','l-indication':'indication',
    'l-operationDone':'operationDone','l-complications':'complications','l-cost':'cost',
    'o-allHospitals':'allHospitals','a-byHospital':'byHospital','a-byOperation':'byOperation',
    'a-byIndication':'byIndication','a-byMonth':'byMonth','a-breakdownTitle':'breakdownTitle',
    'o-granMonth':'granMonth','o-granWeek':'granWeek','o-granYear':'granYear',
    'a-financialTitle':'financialTitle','a-revWeek':'revWeek','a-revMonth':'revMonth','a-revYear':'revYear',
    'l-sheetUrl':'sheetUrl',
    'b-saveUrl':'saveUrl','b-syncNow':'syncNow','b-exportCsv':'exportCsv','b-clearAll':'clearAll','b-forceResync':'forceResync',
    's-totalLbl':'totalOps','s-comprateLbl':'compRate','s-avgcostLbl':'avgCost','s-totalcostLbl':'totalCost'
  };
  for(const id in map){ const el=document.getElementById(id); if(el) el.textContent = dict[map[id]]; }
  document.getElementById('compNoneBtn').textContent = dict.compNone;
  document.getElementById('compYesBtn').textContent = dict.compYes;
  document.getElementById('costExactBtn').textContent = dict.costExact;
  document.getElementById('costLaterBtn').textContent = dict.costLater;
  document.getElementById('costFreeBtn').textContent = dict.costFree;
  document.getElementById('saveBtn').textContent = editingId ? dict.update : dict.save;
  document.getElementById('searchBox').placeholder = dict.searchPh;
  renderRecords();
  renderAnalysis();
  renderBreakdown();
}
function toggleLang(){ lang = lang==='ar' ? 'en':'ar'; persistLang(); applyLang(); }

/* ---------- tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sec-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='records') renderRecords();
    if(btn.dataset.tab==='analysis') renderAnalysis();
  });
});

/* ---------- complication toggle ---------- */
function setComp(hasIssue){
  compHasIssue = hasIssue;
  document.getElementById('compNoneBtn').classList.toggle('sel-none', !hasIssue);
  document.getElementById('compYesBtn').classList.toggle('sel-yes', hasIssue);
  document.getElementById('compNoneBtn').classList.toggle('sel-yes', false);
  document.getElementById('compYesBtn').classList.toggle('sel-none', false);
  document.getElementById('f-complications').style.display = hasIssue ? 'block':'none';
}
let costType = 'exact';
function setCostType(type){
  costType = type;
  document.getElementById('costExactBtn').classList.toggle('sel-exact', type==='exact');
  document.getElementById('costLaterBtn').classList.toggle('sel-later', type==='later');
  document.getElementById('costFreeBtn').classList.toggle('sel-free', type==='free');
  document.getElementById('f-cost').style.display = type==='exact' ? 'block':'none';
  if(type!=='exact') document.getElementById('f-cost').value = '';
}

/* ---------- form ---------- */
function clearForm(){
  ['patientName','age','date','hospital','indication','operationDone','complications','cost'].forEach(id=>{
    document.getElementById('f-'+id).value = '';
  });
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  setComp(false);
  setCostType('exact');
  editingId = null;
  document.getElementById('editHint').style.display='none';
  document.getElementById('saveBtn').textContent = T[lang].save;
}

async function saveRecord(){
  const name = document.getElementById('f-patientName').value.trim();
  if(!name){ alert(T[lang].reqName); return; }
  const rec = {
    id: editingId || (Date.now()+'-'+Math.random().toString(36).slice(2,7)),
    patientName: name,
    age: document.getElementById('f-age').value,
    date: document.getElementById('f-date').value,
    hospital: document.getElementById('f-hospital').value.trim(),
    indication: document.getElementById('f-indication').value.trim(),
    operationDone: document.getElementById('f-operationDone').value.trim(),
    complications: compHasIssue ? (document.getElementById('f-complications').value.trim() || (lang==='ar'?'حدثت مضاعفات':'Complication occurred')) : '',
    costType: costType,
    cost: costType==='exact' ? document.getElementById('f-cost').value : '',
    createdAt: editingId ? (records.find(r=>r.id===editingId)?.createdAt || Date.now()) : Date.now(),
    synced: false
  };
  if(editingId){
    records = records.map(r=> r.id===editingId ? rec : r);
  } else {
    records.push(rec);
  }
  await persistRecords();
  clearForm();
  renderRecords();
  renderAnalysis();
  document.querySelector('.tab-btn[data-tab="new"]').click();
}

function editRecord(id){
  const r = records.find(x=>x.id===id);
  if(!r) return;
  editingId = id;
  document.getElementById('f-patientName').value = r.patientName;
  document.getElementById('f-age').value = r.age;
  document.getElementById('f-date').value = r.date;
  document.getElementById('f-hospital').value = r.hospital;
  document.getElementById('f-indication').value = r.indication;
  document.getElementById('f-operationDone').value = r.operationDone;
  setComp(!!r.complications);
  document.getElementById('f-complications').value = r.complications;
  setCostType(r.costType || 'exact');
  document.getElementById('f-cost').value = r.cost;
  document.getElementById('saveBtn').textContent = T[lang].update;
  document.getElementById('editHint').style.display='block';
  document.getElementById('editHint').textContent = T[lang].editing;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="new"]').classList.add('active');
  document.getElementById('sec-new').classList.add('active');
}

async function deleteRecord(id){
  if(!confirm(T[lang].confirmDel)) return;
  records = records.filter(r=>r.id!==id);
  await persistRecords();
  renderRecords();
  renderAnalysis();
}

/* ---------- records list ---------- */
function fmtMoney(n){ n=Number(n)||0; return n.toLocaleString(lang==='ar'?'ar-EG':'en-US'); }

function renderRecords(){
  const dict = T[lang];
  const hospSel = document.getElementById('hospFilter');
  const hospitals = [...new Set(records.map(r=>r.hospital).filter(Boolean))].sort();
  const currentVal = hospSel.value;
  hospSel.innerHTML = `<option value="">${dict.allHospitals}</option>` + hospitals.map(h=>`<option value="${escapeHtml(h)}">${escapeHtml(h)}</option>`).join('');
  hospSel.value = hospitals.includes(currentVal) ? currentVal : '';

  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const hf = hospSel.value;
  let list = records.filter(r=>{
    if(hf && r.hospital!==hf) return false;
    if(!q) return true;
    return (r.patientName+' '+r.operationDone+' '+r.indication+' '+r.hospital).toLowerCase().includes(q);
  }).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.createdAt-a.createdAt);

  document.getElementById('recCount').textContent = `${list.length} ${list.length===1?dict.recCount1:dict.recCountN}`;

  const container = document.getElementById('recList');
  if(list.length===0){
    container.innerHTML = `<div class="empty">${dict.empty}</div>`;
    return;
  }
  container.innerHTML = list.map(r=>`
    <div class="rec" onclick="toggleDetail('${r.id}')">
      <div class="rec-top">
        <div class="rec-name">${escapeHtml(r.patientName)}</div>
        <div class="rec-date">${escapeHtml(r.date||'')}</div>
      </div>
      <div class="rec-mid">${escapeHtml(r.operationDone||'—')} · ${escapeHtml(r.hospital||'—')}</div>
      <div class="rec-tags">
        ${r.age?`<span class="tag">${escapeHtml(String(r.age))} ${lang==='ar'?'سنة':'yrs'}</span>`:''}
        ${r.costType==='later'?`<span class="tag">${lang==='ar'?'يُدفع لاحقاً':'Pay later'}</span>`:r.costType==='free'?`<span class="tag">${lang==='ar'?'مجاني':'Free'}</span>`:r.cost?`<span class="tag">${fmtMoney(r.cost)} ${lang==='ar'?'ج.م':'EGP'}</span>`:''}
        ${r.complications?`<span class="tag comp">${lang==='ar'?'مضاعفات':'Complication'}</span>`:''}
      </div>
      <div class="rec-detail" id="detail-${r.id}" style="display:none;">
        <div><strong>${dict.indication}:</strong> ${escapeHtml(r.indication||'—')}</div>
        <div><strong>${dict.complications}:</strong> ${escapeHtml(r.complications||dict.compNone)}</div>
        <div class="rec-actions">
          <button onclick="event.stopPropagation();editRecord('${r.id}')">${dict.edit}</button>
          <button class="del" onclick="event.stopPropagation();deleteRecord('${r.id}')">${dict.del}</button>
        </div>
      </div>
    </div>
  `).join('');
}
function toggleDetail(id){
  const el = document.getElementById('detail-'+id);
  if(!el) return;
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- analysis ---------- */
function groupSum(list, keyFn){
  const m = {};
  list.forEach(r=>{
    const k = keyFn(r) || '—';
    m[k] = (m[k]||0)+1;
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function barChart(entries, total){
  const max = entries.length ? entries[0][1] : 1;
  return entries.map(([label,count])=>`
    <div class="bar-row">
      <div class="bl"><span>${escapeHtml(label)}</span><span>${count}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(count/max*100).toFixed(0)}%"></div></div>
    </div>`).join('');
}
function getWeekStart(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = (d.getDay()+6)%7; // Monday = 0
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function timeSeries(list, keyFn, limit){
  const m = {};
  list.forEach(r=>{
    if(!r.date) return;
    const cost = Number(r.cost)||0;
    const k = keyFn(r);
    m[k] = (m[k]||0)+cost;
  });
  let entries = Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
  if(limit) entries = entries.slice(-limit);
  return entries;
}
function moneyBarChart(entries){
  if(entries.length===0) return `<div class="empty" style="padding:10px 0;">—</div>`;
  const max = Math.max(...entries.map(e=>e[1]), 1);
  return entries.map(([label,sum])=>`
    <div class="bar-row">
      <div class="bl"><span>${escapeHtml(label)}</span><span>${fmtMoney(sum)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(sum/max*100).toFixed(0)}%"></div></div>
    </div>`).join('');
}
function renderAnalysis(){
  const dict = T[lang];
  const total = records.length;
  const compCount = records.filter(r=>r.complications).length;
  const costs = records.map(r=>Number(r.cost)||0).filter(n=>n>0);
  const totalCost = costs.reduce((a,b)=>a+b,0);
  const avgCost = costs.length ? Math.round(totalCost/costs.length) : 0;

  document.getElementById('s-total').textContent = total;
  document.getElementById('s-comprate').textContent = total ? Math.round(compCount/total*100)+'%' : '0%';
  document.getElementById('s-avgcost').textContent = fmtMoney(avgCost);
  document.getElementById('s-totalcost').textContent = fmtMoney(totalCost);

  document.getElementById('chart-hospital').innerHTML = barChart(groupSum(records, r=>r.hospital));
  document.getElementById('chart-operation').innerHTML = barChart(groupSum(records, r=>r.operationDone));
  document.getElementById('chart-indication').innerHTML = barChart(groupSum(records, r=>r.indication));
  document.getElementById('chart-month').innerHTML = barChart(
    groupSum(records, r=> r.date ? r.date.slice(0,7) : null).sort((a,b)=>a[0].localeCompare(b[0]))
  );

  document.getElementById('chart-fin-week').innerHTML = moneyBarChart(timeSeries(records, r=>getWeekStart(r.date), 12));
  document.getElementById('chart-fin-month').innerHTML = moneyBarChart(timeSeries(records, r=>r.date.slice(0,7), 12));
  document.getElementById('chart-fin-year').innerHTML = moneyBarChart(timeSeries(records, r=>r.date.slice(0,4)));

  renderBreakdown();
}

/* ---------- hospital & operation breakdown (week / month / year) ---------- */
function periodLabel(dateStr, gran){
  if(!dateStr) return null;
  if(gran==='week') return getWeekStart(dateStr);
  if(gran==='year') return dateStr.slice(0,4);
  return dateStr.slice(0,7);
}
function renderBreakdown(){
  const dict = T[lang];
  const hospSel = document.getElementById('bd-hospital');
  const hospitals = [...new Set(records.map(r=>r.hospital).filter(Boolean))].sort();
  const prevVal = hospSel.value;
  hospSel.innerHTML = `<option value="">${dict.allHospitals}</option>` + hospitals.map(h=>`<option value="${escapeHtml(h)}">${escapeHtml(h)}</option>`).join('');
  hospSel.value = hospitals.includes(prevVal) ? prevVal : '';

  const gran = document.getElementById('bd-gran').value;
  const hf = hospSel.value;
  const list = records.filter(r=> r.date && (!hf || r.hospital===hf));

  const container = document.getElementById('breakdownList');
  if(list.length===0){
    container.innerHTML = `<div class="empty" style="padding:16px 0;">${dict.breakdownEmpty}</div>`;
    return;
  }

  const periods = {};
  list.forEach(r=>{
    const p = periodLabel(r.date, gran);
    if(!periods[p]) periods[p] = {};
    const opKey = hf ? (r.operationDone||'—') : `${r.hospital||'—'} — ${r.operationDone||'—'}`;
    periods[p][opKey] = (periods[p][opKey]||0)+1;
  });

  const sortedPeriods = Object.keys(periods).sort((a,b)=>b.localeCompare(a));

  container.innerHTML = sortedPeriods.map(p=>{
    const ops = Object.entries(periods[p]).sort((a,b)=>b[1]-a[1]);
    const total = ops.reduce((a,[,c])=>a+c,0);
    return `
      <div style="margin-bottom:16px;">
        <div class="bl" style="font-weight:600;color:var(--ink-text);margin-bottom:6px;">
          <span>${escapeHtml(p)}</span><span>${total} ${dict.opsCount}</span>
        </div>
        ${barChart(ops)}
      </div>`;
  }).join('');
}

/* ---------- settings / sheets sync ---------- */
function saveSheetUrl(){
  settings.sheetUrl = document.getElementById('f-sheetUrl').value.trim();
  persistSettings();
  document.getElementById('syncStatus').textContent = T[lang].savedUrl;
}
async function syncToSheets(){
  const dict = T[lang];
  if(!settings.sheetUrl){ document.getElementById('syncStatus').textContent = dict.noUrl; return; }
  const unsynced = records.filter(r=>!r.synced);
  if(unsynced.length===0){ document.getElementById('syncStatus').textContent = dict.nothingToSync; return; }
  document.getElementById('syncStatus').textContent = dict.syncing;
  try{
    await fetch(settings.sheetUrl, {
      method:'POST',
      mode:'no-cors',
      body: new URLSearchParams({data: JSON.stringify(unsynced)})
    });
    records = records.map(r=> unsynced.find(u=>u.id===r.id) ? {...r, synced:true} : r);
    await persistRecords();
    document.getElementById('syncStatus').textContent = dict.synced(unsynced.length);
  }catch(e){
    document.getElementById('syncStatus').textContent = 'Error: '+e.message;
  }
}
async function forceResync(){
  const dict = T[lang];
  if(!settings.sheetUrl){ document.getElementById('syncStatus').textContent = dict.noUrl; return; }
  if(!confirm(dict.forceResyncConfirm)) return;
  records = records.map(r=>({...r, synced:false}));
  await persistRecords();
  await syncToSheets();
}

/* ---------- export ---------- */
function exportCSV(){
  const headers = ['Patient Name','Age','Date','Hospital','Indication','Operation Done','Complications','Cost Type','Cost'];
  const rows = records.map(r=>[r.patientName,r.age,r.date,r.hospital,r.indication,r.operationDone,r.complications,r.costType||'exact',r.cost]);
  const csv = [headers, ...rows].map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'surgical-operations-log.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function clearAll(){
  if(!confirm(T[lang].confirmClear)) return;
  records = [];
  await persistRecords();
  renderRecords();
  renderAnalysis();
}

/* ---------- init ---------- */
(async function init(){
  await loadData();
  document.getElementById('f-sheetUrl').value = settings.sheetUrl || '';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  setComp(false);
  setCostType('exact');
  applyLang();
})();
</script>
